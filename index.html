<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>45WS PSFB Mission Weather Product (MWP) & Multi-Model Forecast Tool</title>
  <!-- Chart.js for Multi-Model Comparison Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- SunCalc for exact Solar/Lunar Illumination calculations -->
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.min.js"></script>
  <!-- html2pdf.js for 1-click Publish to PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-dark: #1e293b;
      --border-color: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
    }

    .app-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #090d16;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 12px;
    }
    .app-brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
    }
    .nav-tabs, .action-btns {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: var(--panel-dark);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent);
      color: #fff;
    }
    .btn {
      padding: 8px 15px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      color: #fff;
    }
    .btn-primary { background: #0284c7; }
    .btn-primary:hover { background: #0369a1; }
    .btn-warning { background: #ca8a04; }
    .btn-warning:hover { background: #a16207; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }

    .view-section { display: none; padding: 20px; max-width: 1600px; margin: 0 auto; }
    .view-section.active { display: block; }

    .control-bar {
      background: var(--panel-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.78rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .form-group input, .form-group select {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 7px 10px;
      border-radius: 5px;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 18px;
    }
    .chart-card {
      background: var(--panel-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }
    .chart-card h3 { margin: 0 0 10px 0; font-size: 0.95rem; color: var(--accent); display: flex; justify-content: space-between; }
    .chart-container { position: relative; height: 270px; width: 100%; }

    .builder-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 1200px) {
      .builder-layout { grid-template-columns: 1fr; }
    }
    .builder-sidebar {
      background: var(--panel-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      position: sticky;
      top: 72px;
      max-height: calc(100vh - 92px);
      overflow-y: auto;
    }
    .builder-sidebar h3 {
      margin: 0 0 12px 0;
      font-size: 0.95rem;
      color: var(--accent);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }
    .dz-control-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .dz-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid var(--border-color);
      font-size: 0.82rem;
    }
    .dz-item select {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    /* Exact 2-Page 45WS MWP Print/PDF Styling */
    #mwp-document-wrapper { display: flex; flex-direction: column; gap: 28px; align-items: center; }
    .mwp-page {
      width: 816px;
      min-height: 1056px;
      background: #ffffff;
      color: #000000;
      padding: 20px 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      font-family: Arial, Helvetica, sans-serif;
      page-break-after: always;
      break-after: page;
    }
    .mwp-page:last-child { page-break-after: auto; break-after: auto; }
    .mwp-frame { border: 2.5px solid #000; width: 100%; }

    .mwp-header-row {
      display: grid;
      grid-template-columns: 1fr 195px;
      border-bottom: 2px solid #000;
      background: linear-gradient(90deg, #071936 0%, #0d2b59 50%, #071936 100%);
    }
    .mwp-banner-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      color: #fff;
    }
    .mwp-patch {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid #facc15;
      background: radial-gradient(circle, #1e3a8a 0%, #091326 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      text-align: center;
      color: #facc15;
      flex-shrink: 0;
    }
    .mwp-banner-text {
      text-align: center;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: 0.04em;
      line-height: 1.25;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    .mwp-meta-table { width: 100%; border-collapse: collapse; font-size: 10.5px; font-weight: 700; }
    .mwp-meta-table td { border-left: 1.5px solid #000; border-bottom: 1.5px solid #000; padding: 3px 5px; text-align: center; }
    .mwp-meta-table tr:last-child td { border-bottom: none; }
    .mwp-meta-label { background: #000; color: #fff; width: 48%; }
    .mwp-meta-val { background: #fff; color: #000; }
    .mwp-meta-table tr:first-child .mwp-meta-val { background: #000; color: #fff; }

    .mwp-black-bar {
      background: #000; color: #fff; text-align: center; font-weight: 700; font-size: 13px;
      padding: 3px 6px; border-top: 1.5px solid #000; border-bottom: 1.5px solid #000;
    }
    .mwp-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .mwp-table th { background: #d9d9d9; color: #000; font-size: 10px; font-weight: 700; border: 1px solid #000; padding: 3px 2px; }
    .mwp-table td { border: 1px solid #000; text-align: center; font-size: 9.5px; font-weight: 700; padding: 3px 2px; line-height: 1.15; }
    .mwp-table td[contenteditable="true"]:hover { background-color: #fef08a !important; cursor: text; }

    .mwp-mid-grid { display: grid; grid-template-columns: 35.5% 64.5%; width: 100%; }
    .mwp-mid-left { border-right: 1.5px solid #000; }
    .mwp-subbar {
      background: #000; color: #fff; font-weight: 700; font-size: 10.5px; padding: 3px 6px;
      display: flex; justify-content: space-between; border-top: 1.5px solid #000; border-bottom: 1.5px solid #000;
    }
    .mwp-subbar.center { justify-content: center; }
    .mwp-fl-table, .mwp-solar-table, .mwp-wwa-table { width: 100%; border-collapse: collapse; }
    .mwp-fl-table th, .mwp-fl-table td, .mwp-solar-table td, .mwp-wwa-table td {
      border: 1px solid #000; font-size: 9.5px; font-weight: 700; padding: 3.5px 3px; text-align: center;
    }
    .mwp-fl-table th { background: #bfbfbf; }
    .mwp-fl-table td:first-child, .mwp-fl-table td:last-child { background: #d9d9d9; }
    .mwp-solar-label { background: #d9d9d9; }
    .mwp-wwa-label { background: #bfbfbf; width: 32%; height: 41px; }
    .mwp-wwa-val { background: #fff; text-align: left !important; padding-left: 8px !important; }

    .mwp-taf-grid { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
    .mwp-taf-box { border: 1px solid #000; display: flex; flex-direction: column; min-height: 122px; }
    .mwp-taf-station { background: #d9d9d9; border-bottom: 1px solid #000; text-align: center; font-weight: 700; font-size: 11px; padding: 2px; }
    .mwp-taf-text { padding: 5px 6px; font-size: 10px; line-height: 1.28; white-space: pre-wrap; flex: 1; }
    .mwp-taf-box.blackout { background: #000; }

    /* Page 2 Hazard Maps & Legend */
    .mwp-p2-maps-row { display: grid; grid-template-columns: 44% 12% 44%; width: 100%; border-bottom: 2px solid #000; }
    .mwp-p2-center-gap { background: #000; }
    .mwp-map-header { display: grid; grid-template-columns: 55% 45%; border-bottom: 1.5px solid #000; font-size: 10.5px; font-weight: 700; text-align: center; }
    .mwp-map-header div { padding: 3px 4px; }
    .mwp-map-header div:first-child { border-right: 1.5px solid #000; }
    .mwp-map-canvas {
      position: relative;
      width: 100%;
      height: 440px;
      background: radial-gradient(circle at 70% 50%, #092247 0%, #0c311e 45%, #163d22 100%);
      overflow: hidden;
    }
    .map-coast-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.45;
      pointer-events: none;
    }
    .map-label {
      position: absolute; background: rgba(225, 232, 225, 0.94); color: #000; font-size: 9px;
      font-weight: 700; padding: 2px 5px; border: 1px solid #333; transform: translate(-50%, -50%);
      white-space: nowrap; pointer-events: none; z-index: 4;
    }
    .map-dot {
      position: absolute; width: 13px; height: 13px; border-radius: 50%; transform: translate(-50%, -50%);
      border: 1.5px solid #fff; cursor: pointer; z-index: 5; box-shadow: 0 0 4px rgba(0,0,0,0.9);
    }
    .map-dot[data-status="YELLOW"] { background: #ffff00; border-color: #d97706; }
    .map-dot[data-status="GREEN"]  { background: #22c55e; }
    .map-dot[data-status="RED"]    { background: #ef4444; }
    .map-dot[data-status="NONE"]   { background: #38bdf8; }

    .mwp-p2-bottom-grid { display: grid; grid-template-columns: 44% 56%; width: 100%; }
    .mwp-legend-col { border-right: 1.5px solid #000; display: flex; flex-direction: column; }
    .mwp-legend-header { background: #000; color: #ffff00; font-size: 9.5px; font-weight: 700; text-align: center; padding: 6px 8px; line-height: 1.25; }
    .mwp-legend-item {
      border-bottom: 1px solid #000; text-align: center; font-weight: 700; font-size: 13px;
      padding: 15px 10px; display: flex; align-items: center; justify-content: center; flex: 1;
    }
    .mwp-legend-item:last-child { border-bottom: none; }
    .mwp-legend-yellow { background: #ffff00; color: #000; }
    .mwp-legend-red    { background: #ff0000; color: #000; }
    .mwp-discussion-col { display: flex; flex-direction: column; }
    .mwp-discussion-title { font-weight: 700; font-size: 12px; text-align: center; padding: 3px; border-bottom: 1.5px solid #000; }
    .mwp-discussion-sub { background: #ff0000; color: #ffff00; font-weight: 700; font-size: 9.5px; text-align: center; padding: 5px 8px; border-bottom: 1.5px solid #000; line-height: 1.25; }
    .mwp-discussion-body { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; font-size: 11.5px; font-weight: 700; white-space: pre-wrap; }

    .point-table { width: 100%; border-collapse: collapse; background: var(--panel-dark); border-radius: 8px; overflow: hidden; }
    .point-table th, .point-table td { border: 1px solid var(--border-color); padding: 10px 12px; text-align: left; font-size: 0.88rem; }
